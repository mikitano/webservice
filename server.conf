# # Inspirado no bloco 'server' do NGINX

# ==========================================
# SERVER 1 - Principal
# ==========================================

server {
    listen 8080;
    server_name localhost;

    # Tamanho máximo do corpo da requisição do cliente
    client_max_body_size 10M;

    # Páginas de erro padrão
    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 405 /errors/405.html;
    error_page 413 /errors/413.html;
    error_page 500 /errors/500.html;
    error_page 502 /errors/502.html;
    error_page 504 /errors/504.html;

    # Site principal
    location / {
        root ./www;
        index index.html;
        allow_methods GET;
        autoindex off;
    }

    # Upload e gerenciamento de arquivos
    location /uploads {
        root ./www;
        allow_methods GET POST DELETE;
        upload_store ./www/uploads;
        autoindex on;
    }

    # CGI
    location /cgi-bin {
        root ./www;
        allow_methods GET POST;
        cgi .py /usr/bin/python3;
    }

    # Redirecionamento
    location /old-page {
        return 301 /;
    }
}


# ==========================================
# SERVER 2 - Teste de outra porta
# ==========================================

server {
    listen 8081;
    server_name site2.local;

    client_max_body_size 100;

    location / {
        root ./www/site2;
        index index.html;
        allow_methods GET POST;
        autoindex off;
    }
}


# ==========================================
# SERVER 3 - Teste de virtual hosting
# ==========================================

server {
    listen 8080;
    server_name outro.local;

    client_max_body_size 10M;

    location / {
        root ./www/site3;
        index index.html;
        allow_methods GET;
        autoindex off;
    }
}