# =====================================================================
#  webserv.conf  -  config de exemplo para usar ATÉ O FIM do projeto
# =====================================================================
#
#  Minhas anotações (combinar tudo isso com o B antes de ele fechar o parser):
#
#  REGRAS DE SINTAXE
#   - cada diretiva termina com ";"
#   - blocos usam { } (server e location)
#   - comentário começa com "#" e fica SEMPRE em linha própria
#     (comentário no fim da linha complica o parser do B, então evitar)
#   - tamanhos aceitam sufixo K e M (1M = 1048576 bytes). Se o B não quiser
#     suportar sufixo, usar o número em bytes puro.
#
#  DIRETIVAS (as que eu uso no CGI estão marcadas com [CGI])
#   listen                 porta do server
#   server_name            nome do host virtual (compara com o header Host)
#   root                   pasta base dos arquivos          [CGI]
#   index                  arquivo padrão de uma pasta
#   autoindex on|off       Define se o servidor pode mostrar o conteúdo de um diretório.
#   allow_methods          métodos aceitos: GET POST DELETE  [CGI]
#   client_max_body_size   limite do body (estourou = 413)   [CGI]
#   error_page CODIGO /caminho   página de erro customizada
#   return CODIGO /destino       redirecionamento (301, 302...)
#   upload_store           pasta onde o POST de upload grava os arquivos
#   cgi .ext /interpretador      extensão -> interpretador   [CGI]
#   location                Agrupa regras aplicáveis a um caminho, como / ou /uploads.
#
#  COMO O LOCATION É ESCOLHIDO
#   - vale o PREFIXO MAIS LONGO que casa com o path
#     ex.: /cgi-bin/x.py casa com "/" e com "/cgi-bin"  ->  vence "/cgi-bin"
#   - o location sempre tem que existir ("/" é o padrão de cada server)
#
#  SERVER PADRÃO
#   - se dois server escutam a MESMA porta, o primeiro do arquivo é o padrão
#     (atende quando o Host não bate com nenhum server_name)
#
# =====================================================================


# =====================================================================
#  SERVER 1  -  o principal, porta 8080
# =====================================================================
server {
    listen 8080;
    server_name localhost;
    root ./www;
    index index.html;

    # Tamanho máximo do corpo da requisição do cliente
    client_max_body_size 10M;

    # Páginas de erro padrão (caminho relativo ao root deste server)
    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 405 /errors/405.html;
    error_page 413 /errors/413.html;
    error_page 500 /errors/500.html;
    error_page 502 /errors/502.html;
    error_page 504 /errors/504.html;

    # ---- raiz do site: só leitura ----
    location / {
        allow_methods GET;
        autoindex off;
    }

    # ---- CGI (a MINHA parte) ----
    # scripts em ./www/cgi-bin, executados pelo interpretador da extensão
    location /cgi-bin {
        root ./www;
        allow_methods GET POST;
        cgi .py /usr/bin/python3;
        # opcional, se eu fizer suporte a PHP depois:
        # cgi .php /usr/bin/php-cgi;
        client_max_body_size 5M;
    }

    # ---- upload e delete de arquivos ----
    # POST envia o arquivo, GET baixa, DELETE apaga
    location /uploads {
        root ./www;
        allow_methods GET POST DELETE;
        upload_store ./www/uploads;
        autoindex on;
        client_max_body_size 20M;
    }

    # ---- listagem de diretório ----
    location /files {
        root ./www;
        allow_methods GET;
        autoindex on;
    }

    # ---- redirecionamentos ----
    # permanente
    location /old-page {
        return 301 /;
    }
    # temporário
    location /tmp-redirect {
        return 302 /files;
    }
}


# =====================================================================
#  SERVER 2  -  outra porta (8081), limite de body minúsculo
#  serve para testar o 413 sem precisar mandar arquivo grande
# =====================================================================
server {
    listen 8081;
    server_name site2.local;
    root ./www/site2;
    index index.html;

    # 100 bytes: qualquer POST maior que isso deve dar 413
    client_max_body_size 100;

    location / {
        allow_methods GET POST;
    }
}


# =====================================================================
#  SERVER 3  -  MESMA porta do server 1 (8080), outro server_name
#  teste de host virtual: o que decide é o header Host.
#  Como o server 1 vem primeiro no arquivo, ele é o padrão da porta 8080.
# =====================================================================
server {
    listen 8080;
    server_name outro.local;
    root ./www/site2;
    index index.html;

    location / {
        allow_methods GET;
    }
}

#teste inicial
server {
    listen 8080;

    location / {
        root ./www;
        index index.html;
    }
}